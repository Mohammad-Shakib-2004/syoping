<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6fc;
}

.manage-products{
    padding:50px;
}

.manage-products h1{
    text-align:center;
    font-size:48px;
    margin-bottom:40px;
}

.category-filter{
    max-width:300px;
    margin:0 auto 40px;
}

.category-filter select{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.manage-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(350px,1fr));
    gap:30px;
}

.manage-card{
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    transition:.3s;
}

.manage-card:hover{
    transform:translateY(-5px);
}

.manage-card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.manage-info{
    padding:20px;
}

.category-badge{
    display:inline-block;
    background:#111;
    color:white;
    padding:8px 15px;
    border-radius:30px;
    font-size:13px;
    margin-bottom:15px;
}

.manage-info h2{
    margin-bottom:10px;
}

.manage-info p{
    color:#666;
    line-height:1.6;
    margin-bottom:15px;
}

.manage-info h3{
    color:#27ae60;
    font-size:24px;
}

.manage-buttons{
    display:flex;
    gap:10px;
    padding:20px;
    border-top:1px solid #eee;
}

.manage-buttons a{
    flex:1;
    text-decoration:none;
}

.manage-buttons button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
}

.edit-btn{
    background:#3498db;
    color:white;
}

.delete-btn{
    background:#e74c3c;
    color:white;
}

.edit-btn:hover{
    background:#2980b9;
}

.delete-btn:hover{
    background:#c0392b;
}

</style>

</head>
<body>

<section class="manage-products">

    <h1>Manage Products</h1>





    <div class="category-filter">

    <select onchange="window.location=this.value">

        <option value="/manage_products"
            {% if not request.args.get('category') %}selected{% endif %}>
            All Categories
        </option>

        {% for category in categories %}
            <option
                value="/manage_products?category={{ category.name }}"
                {% if request.args.get('category') == category.name %}selected{% endif %}>
                {{ category.name }}
            </option>
        {% endfor %}

    </select>

</div>








    <div class="manage-container">

    {% if products %}

        {% for product in products %}

        <div class="manage-card">

            <img src="{{ url_for('static', filename='images/' + product.image) }}" alt="">

            <div class="manage-info">

                <span class="category-badge">
                    {{ product.category_id }}
                </span>

                <h2>{{ product.name }}</h2>

                <p>{{ product.description }}</p>

                <h3>${{ product.price }}</h3>

            </div>

            <div class="manage-buttons">

                <a href="/edit_product/{{ product.id }}">
                    <button type="button" class="edit-btn">
                        Edit
                    </button>
                </a>

                <a href="/delete_product/{{ product.id }}">
                    <button type="button" class="delete-btn">
                        Delete
                    </button>
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <h2 style="width:100%; text-align:center;">
            No Products Found
        </h2>

    {% endif %}

</div>






</section>

</body>
</html>
