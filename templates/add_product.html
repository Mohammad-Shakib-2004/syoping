<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Product | Syoping 쇼핑</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

.navbar{
    background:#fff;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #ddd;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#2563eb;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:20px;
}

.nav-links a{
    text-decoration:none;
    color:#444;
}

.container{
    max-width:1200px;
    margin:40px auto;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.header h1{
    font-size:32px;
}

.submit-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:14px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.submit-btn:hover{
    background:#1d4ed8;
}

.form-layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:25px;
}

.card{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.card h3{
    margin-bottom:20px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
}

textarea{
    min-height:140px;
    resize:vertical;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.upload-box{
    border:2px dashed #cbd5e1;
    border-radius:10px;
    padding:40px;
    text-align:center;
    cursor:pointer;
}

.upload-box:hover{
    background:#f8fafc;
}

.preview{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:8px;
}

.switch{
    display:flex;
    gap:10px;
    align-items:center;
}

.switch input{
    width:auto;
}

@media(max-width:900px){

.form-layout{
    grid-template-columns:1fr;
}

.header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}

}

</style>
</head>
<body>

<nav class="navbar">

<div class="logo">Syoping 쇼핑</div>

<ul class="nav-links">
<li><a href="/">Home</a></li>
<li><a href="/products">Products</a></li>
<li><a href="/admin">Dashboard</a></li>
</ul>

</nav>

<div class="container">

<form method="POST" enctype="multipart/form-data">

<div class="header">

<div>
<h1>Add Product</h1>
<p>Create a new product</p>
</div>

<button type="submit" class="submit-btn">
Save Product
</button>

</div>

<div class="form-layout">

<div>

<div class="card">

<h3>Basic Information</h3>

<div class="form-group">
<label>Product Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Brand</label>
<input type="text" name="brand">
</div>

<div class="form-group">
<label>Description</label>
<textarea name="description"></textarea>
</div>

</div>

<div class="card">

<h3>Product Images</h3>

<label class="upload-box">

Click To Upload Images

<input
type="file"
name="images"
id="images"
multiple
hidden>

</label>

<div id="preview" class="preview"></div>

</div>

</div>

<div>

<div class="card">

<h3>Category</h3>

<div class="form-group">
<label>Select Category</label>
<select name="category_id" required>
    {% for category in categories %}
    <option value="{{ category.id }}">{{ category.name }}</option>
    {% endfor %}
</select>
</div>

</div>

<div class="card">

<h3>Pricing</h3>

<div class="form-group">
<label>Regular Price</label>
<input type="number" name="price" required>
</div>

<div class="form-group">
<label>Sale Price</label>
<input type="number" name="sale_price">
</div>

</div>

<div class="card">

<h3>Inventory</h3>

<div class="form-group">
<label>SKU</label>
<input type="text" name="sku">
</div>

<div class="form-group">
<label>Stock Quantity</label>
<input type="number" name="stock">
</div>

</div>

<div class="card">

<h3>Settings</h3>

<div class="switch">
<input type="checkbox" name="featured">
<label>Featured Product</label>
</div>

<br>

<select name="status">
<option value="Published">Published</option>
<option value="Draft">Draft</option>
<option value="Hidden">Hidden</option>
</select>

</div>

</div>

</div>

</form>

</div>

<script>

const images =
document.getElementById("images");

const preview =
document.getElementById("preview");

images.addEventListener("change",function(){

preview.innerHTML="";

Array.from(this.files).forEach(file=>{

const reader =
new FileReader();

reader.onload=function(e){

const img =
document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

};

reader.readAsDataURL(file);

});

});

</script>

</body>
</html>
