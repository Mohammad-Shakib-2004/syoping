{% extends 'base.html' %}

{% block content %}

<style>
/* ================= PRODUCTS PAGE ================= */
.products-header{
    padding:100px 20px 70px;
    background:#fff;
    text-align:center;
    border-bottom:1px solid #eee;
}

.header-content{
    max-width:750px;
    margin:auto;
}

.subtitle{
    display:inline-block;
    padding:8px 18px;
    border:1px solid #ddd;
    border-radius:50px;
    font-size:12px;
    font-weight:600;
    letter-spacing:2px;
    color:#666;
    margin-bottom:25px;
}

.products-header h1{
    font-size:58px;
    font-weight:700;
    color:#111;
    margin-bottom:20px;
    line-height:1.1;
}

.products-header p{
    font-size:18px;
    color:#666;
    line-height:1.8;
}

.products-page{
    max-width:1400px;
    margin:auto;
    padding:60px 20px;
}

.shop-controls{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
    margin-bottom:50px;
}

.filter-box select{
    padding:15px 18px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    background:white;
    cursor:pointer;
    font-size:15px;
}

.products-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(290px,1fr));
    gap:30px;
}

/* ===== product-box ===== */
.product-box{
    position:relative;
    background:white;
    border:1px solid #eee;
    border-radius:20px;
    overflow:hidden;
    transition:.35s;
}

.product-box:hover{
    transform:translateY(-8px);
    box-shadow:0 15px 40px rgba(0,0,0,.08);
}

.sale-badge{
    position:absolute;
    top:15px;
    left:15px;
    background:#111;
    color:white;
    padding:7px 14px;
    border-radius:30px;
    font-size:11px;
    font-weight:600;
    z-index:2;
}

.wishlist-btn{
    position:absolute;
    top:15px;
    right:15px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    z-index:2;
    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.product-image{
    height:320px;
    overflow:hidden;
    background:#fafafa;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.35s;
}

.product-box:hover .product-image img{
    transform:scale(1.05);
}

.product-info{
    padding:22px;
}

.product-info h3{
    font-size:22px;
    margin-bottom:10px;
    color:#111;
}

.rating{
    color:#f5a623;
    margin-bottom:12px;
}

.rating span{
    color:#666;
}

.product-info p{
    color:#666;
    line-height:1.7;
    height:55px;
    overflow:hidden;
    margin-bottom:15px;
}

.product-info h4{
    font-size:28px;
    margin-bottom:12px;
    color:#111;
}

.stock-status{
    color:#28a745;
    font-weight:600;
    margin-bottom:18px;
}

.product-buttons{
    display:flex;
    gap:10px;
}

.add-cart-btn,
.view-btn{
    flex:1;
    border:none;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
    text-decoration:none;
    transition:.3s;
    padding:13px;
}

.add-cart-btn{
    background:#111;
    color:white;
}

.add-cart-btn:hover{
    background:#000;
}

.view-btn{
    background:#f3f3f3;
    color:#111;
}

.view-btn:hover{
    background:#e8e8e8;
}

#popup{
    position:fixed;
    top:25px;
    right:25px;
    background:#28a745;
    color:white;
    padding:15px 25px;
    border-radius:10px;
    display:none;
    z-index:9999;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

@media(max-width:768px){
    .products-header{
        padding:80px 20px 50px;
    }
    .products-header h1{
        font-size:38px;
    }
    .products-header p{
        font-size:16px;
    }
    .shop-controls{
        flex-direction:column;
        justify-content:center;
    }
    .product-image{
        height:260px;
    }
}
</style>

<!-- ================= PRODUCTS FILTER DROPDOWN ================= -->
<section class="products-page">
    <div class="shop-controls">
       <div class="filter-box">
    <select id="productFilter" onchange="applyFilter()">
        <option value="" {% if not active_category %}selected{% endif %}>Filter Products</option>
        <option value="price_low" {% if active_category=='price_low' %}selected{% endif %}>Price Low → High</option>
        <option value="price_high" {% if active_category=='price_high' %}selected{% endif %}>Price High → Low</option>
        <option value="Fashion" {% if active_category=='Fashion' %}selected{% endif %}>Fashion</option>
        <option value="Electronics" {% if active_category=='Electronics' %}selected{% endif %}>Electronics</option>
        <option value="Shoes" {% if active_category=='Shoes' %}selected{% endif %}>Shoes</option>
        <option value="Accessories" {% if active_category=='Accessories' %}selected{% endif %}>Accessories</option>
        <option value="Gaming" {% if active_category=='Gaming' %}selected{% endif %}>Gaming</option>
        <option value="Beauty" {% if active_category=='Beauty' %}selected{% endif %}>Beauty</option>
    </select>
</div>
    </div>

    <div class="products-grid">
        {% for product in products %}
        <div class="product-box">
            <span class="sale-badge">SALE</span>
            <div class="wishlist-btn">❤</div>
            <a href="/product/{{ product.id }}" class="product-image">
                <img src="{{ product.image }}" alt="{{ product.name }}">
            </a>
            <div class="product-info">
                <h3>{{ product.name }}</h3>
                <div class="rating">★★★★★ <span>(4.8)</span></div>
                <p>{{ product.description }}</p>
                <h4>${{ product.price }}</h4>
                <div class="stock-status">✓ In Stock</div>
                <div class="product-buttons">
                    <button class="add-cart-btn" onclick="addToCart({{ product.id }})" title="Add To Cart">🛒</button>
                    <a href="/product/{{ product.id }}" class="view-btn" title="View Details">👁</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</section>

<div id="popup"></div>

<script>
function addToCart(productId){
    fetch(`/add_to_cart/${productId}`)
    .then(response => response.json())
    .then(data => {
        let popup = document.getElementById("popup");
        popup.style.display = "block";
        popup.innerText = "✅ Product added to cart";
        setTimeout(()=>{popup.style.display="none"},2000);
        let cartCount = document.getElementById("cart-count");
        if(cartCount){ cartCount.innerText = data.cart_count; }
    });
}

function searchProducts(){
    let input = document.getElementById("productSearch").value.toLowerCase();
    let products = document.querySelectorAll(".product-box");
    products.forEach(product=>{
        let title = product.querySelector("h3").innerText.toLowerCase();
        product.style.display = title.includes(input) ? "block" : "none";
    });
}

function applyFilter(){
    let value = document.getElementById("productFilter").value;

    // Category filter
    if(["Fashion","Electronics","Shoes","Accessories","Gaming","Beauty"].includes(value)){
        window.location.href = "/products?category=" + value;
        return;
    }

    // Price sort
    let container = document.querySelector(".products-grid");
    let products = [...document.querySelectorAll(".product-box")];
    products.sort((a,b)=>{
        let priceA = parseFloat(a.querySelector("h4").innerText.replace("$",""));
        let priceB = parseFloat(b.querySelector("h4").innerText.replace("$",""));
        if(value==="price_low") return priceA-priceB;
        if(value==="price_high") return priceB-priceA;
        return 0;
    });
    products.forEach(product => container.appendChild(product));
}
</script>

{% endblock %}
