{% extends 'base.html' %}

{% block content %}

<!-- REGISTER SECTION -->

<section class="register-page">

    <div class="register-box">

        <h1>Create Account</h1>

        <p>
            Join Syoping and start shopping today.
        </p>

        <!-- FLASH MESSAGE -->

        {% with messages = get_flashed_messages() %}

        {% if messages %}

        {% for message in messages %}

        <p>{{ message }}</p>

        {% endfor %}

        {% endif %}

        {% endwith %}

        <!-- REGISTER FORM -->

        <form method="POST">

            <input
                    type="text"
                    name="fullname"
                    placeholder="Full Name"
                    required
            >

            <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
            >

            <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <!-- LINKS -->

        <div class="register-links">

            <a href="/login">
                Already have an account?
            </a>

        </div>

    </div>

</section>

{% endblock %}
