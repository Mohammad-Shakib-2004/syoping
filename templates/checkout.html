<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Checkout | Syoping 쇼핑</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<section class="checkout-page">

  <div class="checkout-container">

    <h1>Checkout</h1>

    <div class="checkout-address">

      <h2>Shipping Address</h2>

      <form action="/checkout" method="POST">

        <input type="text"
               name="full_name"
               placeholder="Full Name"
               required>

        <input type="text"
               name="phone"
               placeholder="Phone Number"
               required>

        <input type="text"
               name="address_line"
               placeholder="Street Address"
               required>

        <input type="text"
               name="city"
               placeholder="City"
               required>

        <input type="text"
               name="postal_code"
               placeholder="Postal Code"
               required>

        <input type="text"
               name="country"
               placeholder="Country"
               required>

        <button type="submit">
          Place Order
        </button>

      </form>

    </div>

  </div>

</section>

</body>

</html>
