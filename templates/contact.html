{% extends 'base.html' %}

{% block content %}

<!-- CONTACT HEADER -->

<section class="contact-header">

    <h1>Contact Us</h1>

    <p>
        We would love to hear from you.
    </p>

</section>

<!-- CONTACT SECTION -->

<section class="contact-page">

    <!-- LEFT -->

    <div class="contact-info">

        <h2>Get In Touch</h2>

        <p>
            Feel free to contact us for any questions,
            support or collaboration.
        </p>

        <div class="info-box">

            <h3>Email</h3>

            <p>support@syoping.com</p>

        </div>

        <div class="info-box">

            <h3>Phone</h3>

            <p>+81 90-1234-5678</p>

        </div>

        <div class="info-box">

            <h3>Address</h3>

            <p>Tokyo, Japan</p>

        </div>

    </div>

    <!-- RIGHT -->

    <div class="contact-form">

        <form>

            <input type="text" placeholder="Your Name">

            <input type="email" placeholder="Your Email">

            <textarea placeholder="Your Message"></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </div>

</section>

{% endblock %}
